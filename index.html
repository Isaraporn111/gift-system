<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Gift System GOT — Supabase Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mali:wght@400;500;600;700&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  <style>

:root{--bg:#f5f3ee;--card:#fffefc;--soft:#f1eee7;--ink:#23273a;--mute:#767b8e;--line:#e8e4da;--accent:#c4453a;--accentbg:#fbeceb;--ok:#2a8556;--okbg:#e5f3ea;--wait:#a5701f;--waitbg:#fbf0dc;--bar:#3a4166;--sh:0 1px 2px rgba(35,39,58,.05),0 6px 20px rgba(35,39,58,.05);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141829;--card:#1c2240;--soft:#252c4f;--ink:#eceaf2;--mute:#9a9fba;--line:#2f3659;--accent:#ff8f85;--accentbg:#3a2130;--ok:#6fd3a0;--okbg:#1d3a31;--wait:#e8bd6a;--waitbg:#3a3220;--bar:#e8bd6a;--sh:none}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.65 "IBM Plex Sans Thai",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 18px 70px}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:23px;margin:0;font-weight:600;letter-spacing:-.2px}
h1:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:10px;vertical-align:middle}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
.sub{color:var(--mute);font-size:13.5px}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{border:0;background:none;color:var(--mute);padding:7px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:500;box-shadow:var(--sh)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
nav button{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
nav button:hover{background:var(--soft)}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:500}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;text-align:center;margin-left:6px}
.note{background:var(--waitbg);color:var(--wait);padding:9px 14px;font-size:13px;margin-bottom:20px;border-radius:12px}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:var(--sh)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:5px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
select:disabled{opacity:.55}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 20px;font:inherit;font-weight:500;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute);font-size:13px}
.scroll{overflow-x:auto}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap;font-weight:500}
.tag.wait{background:var(--waitbg);color:var(--wait)}.tag.done{background:var(--okbg);color:var(--ok)}.tag.low,.tag.late{background:var(--accentbg);color:var(--accent)}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.kpi{background:var(--card);border-radius:16px;padding:14px 18px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:28px;line-height:1.25;font-weight:600}
.kpi span{color:var(--mute);font-size:13px}
.row{display:grid;grid-template-columns:120px 1fr 44px;gap:10px;align-items:center;margin:7px 0;font-size:14.5px}
.lr{width:100%;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:5px 8px;border-radius:10px}
.lr.on{background:var(--soft)}
.track{background:var(--soft);border-radius:6px;height:12px;position:relative;overflow:hidden}
.fill{background:var(--bar);height:100%;border-radius:6px}
.min{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.alert{padding:12px 14px;border-radius:12px;margin-bottom:8px;background:var(--soft)}
.alert.unread{background:var(--waitbg)}
.alert small{color:var(--mute);display:block}
.irow{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-bottom:8px;align-items:center}
.irow3{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.irow2{display:grid;grid-template-columns:1fr 92px 92px;gap:10px;align-items:end;padding:8px 0;border-top:1px solid var(--line)}
.irow2 input{padding:6px 10px}
.irow2 label{margin:0}
.line{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:14.5px;border-top:1px solid var(--line)}
.rq{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}
.rq.isdone{opacity:.82}
.rqh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.rqf{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.rqf>div{min-width:180px;flex:1}
.ql{display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
.side{background:var(--card);border-radius:16px;padding:10px;box-shadow:var(--sh);position:sticky;top:12px}
.tn,.pn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-radius:10px;padding:9px 12px}
.tn{font-weight:500}
.pn{padding:7px 12px 7px 26px;font-size:14.5px;color:var(--mute)}
.tn:hover,.pn:hover{background:var(--soft)}
.tn.on,.pn.on{background:var(--soft);color:var(--ink)}
.pn.on{font-weight:500}
.cnt{min-width:24px;padding:0 7px;border-radius:999px;background:var(--waitbg);color:var(--wait);font-size:12.5px;text-align:center;font-weight:500}
.cnt.z{background:none;color:var(--mute);opacity:.6}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:999px;padding:5px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:14px}
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:20}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;max-width:320px;font-size:14px;box-shadow:var(--sh)}
.empty{color:var(--mute);padding:22px 0;text-align:center}
@media (max-width:760px){.ql{grid-template-columns:1fr}.side{position:static}}
@media (max-width:560px){.row{grid-template-columns:84px 1fr 36px}.irow2{grid-template-columns:1fr 1fr}.irow2 span{grid-column:1/-1}}
.co-row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.co-row:first-of-type{border-top:0}
.cname{font-weight:500;font-size:16px}
.fld{margin-bottom:14px}
/* ===== 8-bit theme ===== */
:root{--bg:#fbf3dc;--card:#fffdf6;--soft:#f4ebcb;--ink:#232a4d;--mute:#5f678e;--line:#dccf9f;--accent:#3f63a8;--accentbg:#ffd6db;--ok:#1f6e3d;--okbg:#c9ecd0;--wait:#8a4a05;--waitbg:#ffe0b0;--bar:#3f63a8;--pk:#232a4d;--org:#f08a2e;--red:#d6304a;--sh:4px 4px 0 var(--pk);--p1:#dbeeff;--p2:#d6f2dc;--p3:#ffe6bf;--p4:#ffdbe2;--inp:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1f42;--card:#262c5a;--soft:#323a72;--ink:#fbf3dc;--mute:#b2b8dc;--line:#46508f;--accent:#7fb0ff;--accentbg:#5a2a42;--ok:#8fe0ab;--okbg:#25523b;--wait:#ffd28a;--waitbg:#5a4524;--bar:#7fb0ff;--pk:#0b0e2a;--org:#ffa24a;--red:#ff8196;--sh:4px 4px 0 var(--pk);--p1:#2c3b78;--p2:#27504a;--p3:#4f4330;--p4:#51304f;--inp:#1b1f42}}
body{background-color:var(--bg);background-image:linear-gradient(90deg,rgba(35,42,77,.05) 2px,transparent 2px),linear-gradient(rgba(35,42,77,.05) 2px,transparent 2px);background-size:24px 24px}
h1,h2,.btn,nav button,.seg button,.chip,.tag,.cname,th{font-family:"Mali","IBM Plex Sans Thai",sans-serif}
.card,.kpi,.rq,.side,.toast,.hero,.alert,.note,.seg,.seg button,nav button,.btn,input,select,.tag,.cnt,.chip,.badge,.tn,.pn,.lr,.track,.fill{border-radius:0}
.card,.kpi,.rq,.side,.hero{border:3px solid var(--pk);box-shadow:var(--sh)}
.card,.rq,.side{background:var(--card)}
.rq{padding:16px 18px;margin-bottom:16px}
.rq.isdone{opacity:.85}
.alert{border:2px solid var(--pk);box-shadow:none}
.note{background:var(--waitbg);color:var(--wait);border:3px dashed var(--org)}
h1{color:var(--accent);font-weight:700;font-size:25px}
h1:before{display:none}
h2{font-weight:600}
h2:before{content:"";display:inline-block;width:10px;height:10px;background:var(--org);box-shadow:3px 3px 0 var(--pk);margin-right:12px;vertical-align:1px}
header.top{justify-content:flex-start;gap:16px}
header.top>:nth-child(3){margin-left:auto}
input,select{background:var(--inp);color:var(--ink);border:3px solid var(--pk);padding:9px 12px}
input:focus,select:focus{outline:0;box-shadow:3px 3px 0 var(--org)}
button:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.btn{border:3px solid var(--pk);box-shadow:3px 3px 0 var(--pk);background:var(--accent);color:#fff;font-weight:600}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--pk)}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn.sm{padding:5px 12px}
.seg{background:var(--card);border:3px solid var(--pk);padding:3px;box-shadow:3px 3px 0 var(--pk);gap:2px}
.seg button{color:var(--ink);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--org);color:#232a4d;box-shadow:none;font-weight:600}
nav button{border:3px solid transparent;color:var(--ink);font-weight:500}
nav button:hover{background:var(--soft);border-color:var(--pk)}
nav button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--pk);box-shadow:3px 3px 0 var(--pk)}
.chip{border:3px solid var(--pk);color:var(--ink);background:var(--card);font-weight:500}
.chip.on{background:var(--org);color:#232a4d;border-color:var(--pk)}
.tag{border:2px solid var(--pk);font-weight:600}
.tag.low,.tag.late{color:var(--red)}
.cnt{border:2px solid var(--pk);font-family:"Pixelify Sans",sans-serif;font-weight:600;color:var(--wait)}
.cnt.z{background:none;border-color:transparent;opacity:.55}
.badge{border:2px solid var(--pk);font-family:"Pixelify Sans",sans-serif;background:var(--red);color:#fff}
.track{border:2px solid var(--pk);height:16px;background:var(--card)}
.fill{background:repeating-linear-gradient(90deg,var(--bar) 0 6px,transparent 6px 8px)}
.min{background:var(--red);width:3px}
.row b,.kpi b,.hero-t{font-family:"Pixelify Sans","Mali",sans-serif}
.kpi b{font-size:32px;color:var(--accent)}
.kpi:nth-child(1){background:var(--p1)}.kpi:nth-child(2){background:var(--p2)}.kpi:nth-child(3){background:var(--p3)}.kpi:nth-child(4){background:var(--p4)}
.tn.on,.pn.on{background:var(--waitbg);color:var(--ink);box-shadow:inset 4px 0 0 var(--org)}
.lr.on{background:var(--waitbg)}
th,td{border-bottom:2px dashed var(--line)}
.irow2,.line,.rqf{border-top:2px dashed var(--line)}
.toast{background:var(--pk);color:#fbf3dc;border:3px solid var(--org);box-shadow:var(--sh)}
.toast:before{content:"\2605  ";color:var(--org)}
.empty{font-family:"Mali",sans-serif;font-weight:500}
.hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--p1);padding:16px 20px;margin-bottom:20px}
.hero-t{font-size:26px;font-weight:700;color:var(--accent);letter-spacing:1px;line-height:1.2}
.pxc{display:flex;justify-content:center;margin-bottom:8px}
.px{display:block;image-rendering:pixelated;flex:none}
.bob{animation:bob 1.2s infinite}
@keyframes bob{0%,49%{transform:translateY(0)}50%,100%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.bob{animation:none}.btn:hover{transform:none}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn,:root:not([data-theme="light"]) nav button[aria-selected="true"]{color:#0b0e2a}:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}}
.irow{grid-template-columns:48px 1fr 90px auto}
.thumb{display:block;object-fit:cover;border:3px solid var(--pk);background:var(--soft);flex:none}
.thumb.ph{display:flex;align-items:center;justify-content:center;background:var(--p3);overflow:hidden}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-bottom:16px}
.gcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;border:3px solid var(--pk);background:var(--card);color:var(--ink);font:inherit;cursor:pointer;box-shadow:3px 3px 0 var(--pk);text-align:center}
.gcard:hover{transform:translate(-1px,-1px)}
.gcard:active{transform:translate(2px,2px);box-shadow:none}
.gcard.on{background:var(--waitbg)}
.gcard:disabled{opacity:.5;cursor:not-allowed}
.gcard .gn{font-weight:500;font-size:14px;line-height:1.3}
.gcard .badge{position:absolute;top:-10px;right:-10px;margin:0}
.btn.danger{background:var(--card);color:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:var(--red)}}
.dash2{display:grid;gap:18px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:18px}
.dash2 .card{margin-bottom:0}
@media (max-width:860px){.dash2{grid-template-columns:1fr}}
.mask{position:fixed;inset:0;background:rgba(35,42,77,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:var(--card);border:3px solid var(--pk);box-shadow:var(--sh);padding:20px;max-width:380px;width:100%}
.dlg-t{font-weight:500;margin-bottom:16px}
.dlg-b{display:flex;gap:10px;justify-content:flex-end}
body.wait,body.wait *{cursor:progress}
body.wait .btn{opacity:.65;pointer-events:none}

    .wrap{max-width:1000px}
    .preview-note{background:var(--p3);border:3px solid var(--pk);padding:12px 15px;margin-bottom:18px;font-weight:600}
    .form-card{max-width:520px;margin-inline:auto}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .muted{color:var(--mute)}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
    .product-mini{border:3px solid var(--pk);padding:12px;background:var(--card);box-shadow:3px 3px 0 var(--pk)}
    .product-mini strong{display:block;min-height:2.9em}
    .product-mini .num{font:700 26px/1.35 'Pixelify Sans',sans-serif;color:var(--accent)}
    .notice{border:3px dashed var(--org);padding:11px 14px;margin-block:16px;background:var(--p3)}
    .scroll table{min-width:690px}
    .field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-bottom:15px}
    .notice.good{background:var(--p2);border-color:var(--ok)}
    .notice.bad{background:var(--p4);border-color:var(--red)}
    .request-card{border:3px solid var(--pk);background:var(--card);padding:14px;margin:12px 0}
    .request-card h3{margin:0 0 8px}
    .request-actions{display:flex;gap:8px;flex-wrap:wrap}
    .pill{display:inline-block;border:2px solid var(--pk);padding:2px 7px;background:var(--p1);font-size:12px}
    code{overflow-wrap:anywhere}
    .top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
 <div class="wrap">
   <header class="top" id="top"><h1>🎁 Gift System GOT</h1></header>
   <div class="preview-note">🧪 PREVIEW: เชื่อมต่อ Supabase สำหรับทดสอบเท่านั้น • ห้าม Merge เข้า main ก่อนตรวจฟังก์ชันครบ</div>

 </div>
 <div id="toasts" aria-live="polite"></div>
</body>
</html>
